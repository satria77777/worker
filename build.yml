name: Build Sync XxX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      appName:
        description: 'Nama aplikasi'
        required: false
        default: 'AndroidApp'
        type: string
      buildType:
        description: 'Tipe build (release/debug)'
        required: false
        default: 'release'
        type: string
      flavor:
        description: 'Flavor build (kalau project pakai product flavors)'
        required: false
        default: 'default'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      # Deteksi otomatis folder project Android — gak dihardcode ke "android/" lagi,
      # biar base yang strukturnya beda (folder namanya beda / kode di subfolder lain)
      # tetap ketemu selama ada file build.gradle di dalamnya.
      - name: Detect Android project directory
        id: detect
        run: |
          ANDROID_DIR=$(find . -maxdepth 3 -name "build.gradle" -o -name "build.gradle.kts" | grep -v "/app/" | head -1 | xargs dirname)
          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR="android"
          fi
          echo "Terdeteksi folder Android project: $ANDROID_DIR"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      # Skip generate icon kalau script-nya emang gak ada di base itu — dulu ini
      # bikin build langsung gagal total kalau file-nya gak ketemu.
      - name: Generate App Icons (kalau ada script-nya)
        run: |
          if [ -f "generate_icons.py" ]; then
            python3 generate_icons.py
          else
            echo "generate_icons.py tidak ditemukan, skip step ini."
          fi

      # Baca versi Gradle Wrapper langsung dari gradle-wrapper.properties project itu,
      # bukan dihardcode ke v8.4.0 — ini penyebab paling umum base lain gagal build kalau
      # dia pakai versi Gradle yang beda (misal base kamu pakai 8.14, bukan 8.4.0).
      - name: Setup Gradle Wrapper (versi dinamis sesuai project)
        env:
          ANDROID_DIR: ${{ steps.detect.outputs.android_dir }}
        run: |
          WRAPPER_PROPS="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9.]+(?=-bin.zip|-all.zip)' "$WRAPPER_PROPS" | head -1)
          fi
          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.4.0"
            echo "Versi Gradle tidak terdeteksi dari project, pakai default $GRADLE_VERSION"
          else
            echo "Versi Gradle terdeteksi dari project: $GRADLE_VERSION"
          fi

          mkdir -p "$ANDROID_DIR/gradle/wrapper"
          curl -L -o "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" \
            "https://github.com/gradle/gradle/raw/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Pakai input dari bot: buildType nentuin task Gradle (assembleRelease / assembleDebug),
      # flavor ditambahin ke depan task-nya kalau bukan "default".
      - name: Build APK
        env:
          ANDROID_DIR: ${{ steps.detect.outputs.android_dir }}
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'release' }}
          FLAVOR: ${{ github.event.inputs.flavor || 'default' }}
        run: |
          cd "$ANDROID_DIR"
          TASK_TYPE="$(echo "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
          if [ "$FLAVOR" != "default" ] && [ -n "$FLAVOR" ]; then
            FLAVOR_CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            TASK="assemble${FLAVOR_CAP}${TASK_TYPE}"
          else
            TASK="assemble${TASK_TYPE}"
          fi
          echo "Menjalankan task: $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Rename APK
        env:
          ANDROID_DIR: ${{ steps.detect.outputs.android_dir }}
          APP_NAME: ${{ github.event.inputs.appName || 'AndroidApp' }}
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'release' }}
        run: |
          mkdir -p output
          APK_FILE=$(find "$ANDROID_DIR/app/build/outputs/apk/" -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Tidak ada file APK yang ketemu di outputs/apk/ — build kemungkinan gagal di step sebelumnya."
            exit 1
          fi
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]_-')
          cp "$APK_FILE" "output/${SAFE_NAME:-SyncXxX}.apk"
          echo "apk_name=${SAFE_NAME:-SyncXxX}.apk" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPro-APK
          path: output/${{ env.apk_name }}
          retention-days: 30
