name: Vorlex Web2APK Build
run-name: Web2APK - ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      source_type:
        required: true
        type: string
      source_url:
        required: false
        type: string
      build_mode:
        required: true
        type: string
      build_variant:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build input
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare source
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          rm -rf /tmp/vorlex-site
          mkdir -p /tmp/vorlex-site
          if [ "$SOURCE_TYPE" = "url" ]; then
            case "$SOURCE_URL" in
              http://*|https://*) ;;
              *) echo "Invalid URL"; exit 1;;
            esac
            curl -L --fail --max-time 60 --retry 2 -o /tmp/site.html "$SOURCE_URL"
            cp /tmp/site.html /tmp/vorlex-site/index.html
          else
            if [ -f "input/${{ inputs.job_id }}/index.html" ]; then
              cp "input/${{ inputs.job_id }}/index.html" /tmp/vorlex-site/index.html
            else
              test -f "input/${{ inputs.job_id }}/site.zip"
              unzip -q "input/${{ inputs.job_id }}/site.zip" -d /tmp/vorlex-site
              if [ -f /tmp/vorlex-site/index.html ]; then :
              else
                FIRST_HTML=$(find /tmp/vorlex-site -type f -iname '*.html' | head -1 || true)
                test -n "$FIRST_HTML"
                cp "$FIRST_HTML" /tmp/vorlex-site/index.html
              fi
            fi
          fi
          test -f /tmp/vorlex-site/index.html

      - name: Build Android app
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_URL: ${{ inputs.source_url }}
          BUILD_MODE: ${{ inputs.build_mode }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          rm -rf build_app artifacts
          mkdir -p artifacts
          SAFE_NAME=$(echo "$APP_NAME" | tr ' /' '__' | tr -cd 'A-Za-z0-9_.-')
          PROJECT_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_' | cut -c1-28)
          PROJECT_NAME=${PROJECT_NAME:-vorlex_app}

          if [ "$BUILD_MODE" = "native" ]; then
            mkdir -p build_app/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/') build_app/app/src/main/assets/site
            cat > build_app/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "VorlexNative"
          include ":app"
          GRADLE
            cat > build_app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE
            cat > build_app/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS
            cat > build_app/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace System.getenv("PACKAGE_NAME")
              compileSdk 35
              defaultConfig {
                  applicationId System.getenv("PACKAGE_NAME")
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"              }
          }
          GRADLE
            cat > build_app/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme" android:label="${APP_NAME}">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
            mkdir -p build_app/app/src/main/res/values
            cat > build_app/app/src/main/res/values/styles.xml <<'STYLES'
          <resources><style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#6d5dfc</item></style></resources>
          STYLES
            cat > build_app/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java <<'JAVA'
          package PLACEHOLDER_PACKAGE;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              String type = "SOURCE_TYPE_PLACEHOLDER";
              String url = "SOURCE_URL_PLACEHOLDER";
              if ("url".equals(type) && url != null && !url.isEmpty()) w.loadUrl(url);
              else w.loadUrl("file:///android_asset/site/index.html");
              setContentView(w);
            }
          }
          JAVA
            MAIN=$(find build_app/app/src/main/java -name MainActivity.java)
            sed -i "s/PLACEHOLDER_PACKAGE/$PACKAGE_NAME/" "$MAIN"
            python3 - <<'PY'
          from pathlib import Path
          import os
          p=next(Path("build_app/app/src/main/java").rglob("MainActivity.java"))
          s=p.read_text().replace("SOURCE_TYPE_PLACEHOLDER", os.environ["SOURCE_TYPE"]).replace("SOURCE_URL_PLACEHOLDER", os.environ["SOURCE_URL"].replace("\\", "\\\\").replace('"', '\\\"'))
          p.write_text(s)
          PY
            sed -i "s/${APP_NAME}/$APP_NAME/g" build_app/app/src/main/AndroidManifest.xml
            if [ "$SOURCE_TYPE" = "url" ]; then
              # Keep a tiny local fallback page; runtime will load SOURCE_URL from the build environment only.
              cat > build_app/app/src/main/assets/site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Vorlex</title><p>Loading website…</p>
          HTML
            else
              cp -R /tmp/vorlex-site/. build_app/app/src/main/assets/site/
            fi
            cd build_app
            gradle --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../artifacts/${SAFE_NAME}.apk"
          else
            flutter create --platforms=android --org com.vorlex --project-name "$PROJECT_NAME" build_app
            cd build_app
            python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('dependencies:\n', 'dependencies:\n  webview_flutter: ^4.13.0\n', 1)
          s = s.replace('flutter:\n  uses-material-design: true', 'flutter:\n  uses-material-design: true\n  assets:\n    - assets/site/')
          p.write_text(s)
          PY
            mkdir -p assets/site
            cp -R /tmp/vorlex-site/. assets/site/
            python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          PY
            cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          void main() => runApp(const VorlexApp());
          class VorlexApp extends StatefulWidget { const VorlexApp({super.key}); @override State<VorlexApp> createState()=>_VorlexAppState(); }
          class _VorlexAppState extends State<VorlexApp> {
            late final WebViewController controller;
            @override void initState(){ super.initState(); controller=WebViewController()..setJavaScriptMode(JavaScriptMode.unrestricted)..setNavigationDelegate(NavigationDelegate());
              const t=String.fromEnvironment('SOURCE_TYPE',defaultValue:'file'); const u=String.fromEnvironment('SOURCE_URL',defaultValue:'');
              if(t=='url'&&u.isNotEmpty) controller.loadRequest(Uri.parse(u)); else controller.loadFlutterAsset('assets/site/index.html'); }
            @override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false,title:String.fromEnvironment('APP_NAME',defaultValue:'Vorlex Web'),home:Scaffold(body:SafeArea(child:WebViewWidget(controller:controller))));
          }
          DART
            flutter pub get
            if [ "$BUILD_VARIANT" = "debug" ]; then
              flutter build apk --debug --dart-define=APP_NAME="$APP_NAME" --dart-define=SOURCE_TYPE="$SOURCE_TYPE" --dart-define=SOURCE_URL="$SOURCE_URL"
              cp build/app/outputs/flutter-apk/app-debug.apk "../artifacts/${SAFE_NAME}-debug.apk"
            else
              flutter build apk --release --dart-define=APP_NAME="$APP_NAME" --dart-define=SOURCE_TYPE="$SOURCE_TYPE" --dart-define=SOURCE_URL="$SOURCE_URL"
              cp build/app/outputs/flutter-apk/app-release.apk "../artifacts/${SAFE_NAME}-release.apk"
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vorlex-apk-${{ inputs.job_id }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 2
