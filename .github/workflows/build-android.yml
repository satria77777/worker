name: Build Android APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Project
        run: |
          URL=$(echo '${{ github.event.inputs.payload }}' | jq -r '.url')
          if [ "$URL" != "null" ] && [ -n "$URL" ]; then
            echo "Downloading source from $URL"
            wget -q -O project.zip "$URL"
            unzip -q project.zip -d project
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          fi
          # Deteksi lokasi gradle root (folder berisi gradlew / settings.gradle)
          GRADLE_ROOT=$(find project -name 'gradlew' -type f -exec dirname {} \; | head -n 1)
          if [ -z "$GRADLE_ROOT" ]; then
            GRADLE_ROOT=$(find project -name 'settings.gradle*' -type f -exec dirname {} \; | head -n 1)
          fi
          echo "GRADLE_ROOT=$GRADLE_ROOT" >> $GITHUB_ENV
          echo "Gradle root detected: $GRADLE_ROOT"

      - name: Build APK
        run: |
          cd "$GRADLE_ROOT"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find "$GRADLE_ROOT" -name '*.apk' -path '*outputs*' -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$GRADLE_ROOT" -name 'app-release.apk' -type f | head -n 1)
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK found: $APK_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
