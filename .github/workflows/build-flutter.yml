name: Build Flutter APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Prepare Project
        run: |
          # Payload berisi URL source ZIP yang di-host bot server
          URL=$(echo '${{ github.event.inputs.payload }}' | jq -r '.url')
          if [ "$URL" != "null" ] && [ -n "$URL" ]; then
            echo "Downloading source from $URL"
            wget -q -O project.zip "$URL"
            unzip -q project.zip -d project
          fi
          # Deteksi folder berisi pubspec.yaml (flutter root)
          FLUTTER_ROOT=$(find project -name 'pubspec.yaml' -type f -exec dirname {} \; | head -n 1)
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> $GITHUB_ENV
          echo "Flutter root detected: $FLUTTER_ROOT"

      - name: Build APK
        run: |
          cd "$FLUTTER_ROOT"
          flutter pub get
          flutter build apk --release

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find "$FLUTTER_ROOT" -name '*.apk' -path '*outputs*' -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$FLUTTER_ROOT" -name 'app-release.apk' -type f | head -n 1)
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK found: $APK_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
